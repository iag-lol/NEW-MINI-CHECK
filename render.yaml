# Configuración del sitio estático en Render.
#
# ATENCIÓN: Render SÓLO lee este archivo si el servicio se creó como
# "Blueprint". Si se creó a mano desde el panel —que es el caso hoy—, este
# archivo se ignora por completo y mandan los ajustes del panel. Se comprobó
# contra el sitio en vivo: las cabeceras que llegan no son las de aquí.
#
#   $ curl -sI https://new-mini-check.onrender.com/ | grep cache-control
#   cache-control: public, max-age=0, s-maxage=300     <- el defecto de Render
#
# Lo que hay que dejar igual en el panel está en docs/render-cabeceras.md.

services:
  - type: web
    name: new-mini-check
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    headers:
      # Los archivos de /assets llevan el hash del contenido en el nombre
      # (index-CxUljM54.js). Nunca cambian: si cambia el contenido, cambia el
      # nombre. Por eso se pueden guardar un año sin volver a preguntar, y por
      # eso hay que hacerlo: con el defecto de Render el navegador revalida
      # CADA archivo en CADA carga, y en el celular de un terminal eso son
      # segundos de espera en cada pantalla.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # El HTML es lo contrario: siempre hay que preguntarlo. Es quien nombra
      # los archivos con hash, así que si se queda guardado sigue pidiendo
      # piezas que el despliegue nuevo ya borró, y la app muere con
      # "Failed to fetch dynamically imported module".
      #
      # El defecto de Render trae s-maxage=300: su CDN sirve el HTML viejo
      # hasta cinco minutos DESPUÉS de desplegar, cuando los archivos que ese
      # HTML nombra ya no existen. Son cinco minutos de app rota en cada
      # despliegue, y hay que quitarlo.
      - path: /*
        name: Cache-Control
        value: no-cache

    routes:
      - type: rewrite
        source: /app/*
        destination: /index.html
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
