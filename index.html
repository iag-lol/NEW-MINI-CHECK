<!doctype html>
<!--
  lang="es" + notranslate: la interfaz está en español. Con lang="en" el
  navegador ofrecía traducir la página y Google Translate reemplaza nodos
  del DOM que React sigue controlando, provocando el crash
  "Failed to execute 'insertBefore' on 'Node'".
-->
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mini-check-mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070b16" />
    <meta
      name="description"
      content="Mini-Check: plataforma empresarial de inspección y control operacional de flota."
    />

    <!-- Instalación como aplicación (Android, Windows, macOS, ChromeOS) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Instalación como aplicación en iOS / iPadOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mini-Check" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Anclaje en Windows -->
    <meta name="application-name" content="Mini-Check" />
    <meta name="msapplication-TileColor" content="#4F46E5" />
    <meta name="msapplication-TileImage" content="/icons/icon-192.png" />

    <title>Mini-Check | Control Operacional</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
