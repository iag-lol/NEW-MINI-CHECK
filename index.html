<!doctype html>
<!--
  lang="es" + notranslate: la interfaz está en español. Con lang="en" el
  navegador ofrecía traducir la página y Google Translate reemplaza nodos
  del DOM que React sigue controlando, provocando el crash
  "Failed to execute 'insertBefore' on 'Node'".
-->
<html lang="es" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mini-check-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef2ff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050914" />
    <meta
      name="description"
      content="Mini-Check: plataforma empresarial de inspección y control operacional de flota."
    />
    <title>Mini-Check | Control Operacional</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
